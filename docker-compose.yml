services:
  revector:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      REVECTOR_DATA_DIR: /engine/data
      REVECTOR_WORKER_THREADS: "2"
      REVECTOR_SYNC_JOBS: "false"
    volumes:
      - revector-data:/engine/data
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

volumes:
  revector-data:
