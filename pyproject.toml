[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "revector-engine"
version = "0.1.0"
description = "Deterministic raster reconstruction into validated editable vector geometry"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.18,<1", "numpy>=2,<3", "opencv-python-headless>=4.10,<5",
  "Pillow>=11,<13", "defusedxml>=0.7,<1", "svgpathtools>=1.6,<2",
  "shapely>=2,<3", "scikit-image>=0.24,<1", "resvg-py>=0.2,<1",
]

[project.optional-dependencies]
trace = ["vtracer>=0.6,<1"]
r2 = ["boto3>=1.35,<2"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
revector = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["web/*", "web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
